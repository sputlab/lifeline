<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>LifeLine - Linea non disponibile</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: grid; place-items: center; background: #0b0e14; color: #e6e9ef;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { margin: 16px 0 8px; font-size: 1.5rem; letter-spacing: .02em; }
        p { margin: 0 0 20px; color: #9aa3b2; max-width: 34ch; line-height: 1.5; }
        button { font: inherit; font-weight: 600; color: #fff; background: #d62a2a; border: 0;
                 border-radius: 8px; padding: 10px 22px; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="assets/icons/icon-192.png" alt="">
        <h1>Linea non disponibile</h1>
        <p>LifeLine ha bisogno della connessione per accedere alla centrale. Controlla la rete e riprova.</p>
        <button type="button" onclick="location.reload()">Riprova</button>
    </main>
</body>
</html>
